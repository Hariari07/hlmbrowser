name: Publish distribution packages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-hlm-dist
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS-1.1.0
      - name: Upload verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.1.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title 'HLM Browser 1.1.0 — development prerelease' \
              --notes 'Development packages from dist/. Windows/macOS binaries are unsigned; the debug APK is debug-signed and the release APK requires your signing key. See docs/build-report.md for validation and limitations.'
          fi
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -ge 8
          gh release upload v1.1.0 --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          gh release edit v1.1.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
