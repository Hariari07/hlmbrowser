plugins { id 'com.android.application' }
dependencies { testImplementation 'junit:junit:4.13.2' }
android {
    namespace 'com.hlm.browser'
    compileSdk 35
    defaultConfig { applicationId 'com.hlm.browser'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (System.getenv('HLM_KEYSTORE')) {
        signingConfigs { release { storeFile file(System.getenv('HLM_KEYSTORE')); storePassword System.getenv('HLM_STORE_PASSWORD'); keyAlias System.getenv('HLM_KEY_ALIAS'); keyPassword System.getenv('HLM_KEY_PASSWORD') } }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
